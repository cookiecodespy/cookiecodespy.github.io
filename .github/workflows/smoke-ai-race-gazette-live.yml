name: Smoke Test AI Race Gazette Live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke-ai-race-gazette-live.yml'
      - 'ai-race-gazette/source/scripts/live-qa.mjs'
  workflow_dispatch:
  schedule:
    - cron: '25 13 * * *'

permissions:
  contents: read

concurrency:
  group: ai-race-gazette-live-smoke
  cancel-in-progress: false

jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ai-race-gazette/source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ai-race-gazette/source/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test actual published GitHub Pages
        run: npm run test:live
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gazette-public-smoke
          path: ai-race-gazette/source/qa/live-*
          if-no-files-found: warn
