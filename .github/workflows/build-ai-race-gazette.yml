name: Build AI Race Gazette

on:
  push:
    branches: [main]
    paths:
      - 'ai-race-gazette/source/src/**'
      - 'ai-race-gazette/source/index.html'
      - 'ai-race-gazette/source/package.json'
      - 'ai-race-gazette/source/package-lock.json'
      - 'ai-race-gazette/source/vite.config.mjs'
      - 'ai-race-gazette/source/scripts/**'
      - 'ai-race-gazette/source/research/**'
      - 'ai-race-gazette/source/visual/**'
      - 'ai-race-gazette/source/tests/**'
      - '.github/workflows/build-ai-race-gazette.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-race-gazette-build
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-race-gazette/source
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ai-race-gazette/source/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Editorial validation
        run: |
          python3 -m unittest tests/editorial_test.py
          python3 scripts/editorial.py --validate-only
          python3 scripts/quality-audit.py
          python3 scripts/validate_source_registry.py
          python3 scripts/validate_coverage_audit.py
          python3 scripts/validate_visual_desk.py

      - name: Build
        run: npm run build

      - name: Sites worker tests
        run: npm run test:sites

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Browser QA
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/gazette-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          npm run test:browser

      - name: Reconcile latest main
        working-directory: .
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Publish compiled frontend
        run: |
          cp dist/client/index.html ../index.html
          mkdir -p ../assets
          rm -f ../assets/index-*.js ../assets/index-*.css
          cp -R dist/client/assets/. ../assets/

      - name: Commit compiled frontend when changed
        working-directory: .
        run: |
          if git diff --quiet -- ai-race-gazette/index.html ai-race-gazette/assets; then
            echo "No compiled frontend changes."
            exit 0
          fi
          git config user.name "AI Race Gazette Build"
          git config user.email "actions@users.noreply.github.com"
          git add -A ai-race-gazette/index.html ai-race-gazette/assets
          git commit -m "build: publish AI Race Gazette frontend [skip ci]"
          git push
